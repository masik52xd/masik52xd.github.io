<style>

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--tx);overflow:hidden;background:radial-gradient(ellipse 100% 70% at 50% 0,#fafafa 0%,#ebebeb 55%,#dcdcdc 100%);display:flex;flex-direction:column;user-select:none}

.sd{all:unset;cursor:pointer;display:grid;place-items:center;margin-right:4px}.sd .x{display:none}.sd.off .w{display:none}.sd.off .x{display:block}.sd:focus-visible svg{stroke:var(--cy)}
.bat{width:30px;height:14px;border:2px solid var(--tx);border-radius:3px;padding:1px;position:relative}
.bat::after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:6px;background:var(--tx);border-radius:0 2px 2px 0}

main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,4.5vh,46px);padding-bottom:5vh}
.shelf{overflow:hidden;padding:64px 0 22px;margin:-30px 0 -10px}
.track{display:flex;gap:calc(var(--ts)*.09);width:max-content;position:relative;transition:transform .35s cubic-bezier(.25,.9,.3,1)}
.tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;flex:none;width:var(--ts);height:var(--ts);transition:transform .2s}
.art{position:absolute;inset:0;border-radius:3px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 12px 11px;font-size:clamp(14px,1.3vw,18px);box-shadow:0 2px 6px rgba(0,0,0,.3);background:linear-gradient(145deg,var(--a),var(--b));text-shadow:0 1px 2px rgba(0,0,0,.3)}

.art svg{position:absolute;left:50%;top:40%;width:42%;transform:translate(-50%,-50%);fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.nm{position:absolute;left:0;bottom:calc(100% + 16px);font-size:17px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .2s}
.tile.sel{transform:scale(1.07);z-index:3}
.tile.sel .nm{opacity:1}
.tile.sel::after,.dk.on::after{content:"";position:absolute;inset:-6px;border:4px solid var(--cy);box-shadow:0 0 0 2px #fff inset,0 0 0 2px #fff,0 0 20px 6px rgba(0,195,227,.5);animation:glow 1.3s ease-in-out infinite;pointer-events:none}
.dk.on::after{border-radius:50%;inset:-7px}
.zb .tile.sel::after{display:none}.zb .tile.sel{transform:none}.zb .tile.sel .nm{opacity:0}
@keyframes glow{50%{border-color:#7df0ff;box-shadow:0 0 0 2px #fff inset,0 0 0 2px #fff,0 0 8px 2px rgba(0,195,227,.3)}}
@keyframes rain{to{filter:hue-rotate(360deg)}}
body.rb .tile.sel::after,body.rb .dk.on::after{animation:glow 1.3s ease-in-out infinite,rain .9s linear infinite}
.cap{text-align:center;min-height:3.6em;padding:0 24px;font-size:15px;line-height:1.5}
.cap b{display:block;font-size:12px;letter-spacing:1.5px;color:#0a9bb5;font-weight:700;margin-bottom:2px}
.cap span{display:block;max-width:62ch;margin:0 auto;color:#555}
.zb .cap{visibility:hidden}
.dock{display:flex;justify-content:center;gap:clamp(12px,2vw,26px);flex-wrap:wrap;padding:0 16px 30px}
.dk{all:unset;cursor:pointer;position:relative;width:clamp(50px,4.6vw,64px);height:clamp(50px,4.6vw,64px);border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25),inset 0 0 0 1px #e2e2e2;display:grid;place-items:center;transition:transform .2s}
.dk svg{width:48%;fill:none;stroke:#5a5a5a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dk .lb{position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .2s}
.dk.on{transform:scale(1.1)}.dk.on .lb{opacity:1}
.ov{position:fixed;inset:0;z-index:20;background:rgba(235,235,235,.75);backdrop-filter:blur(6px);display:none;place-items:center;padding:20px}
.ov.on{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{width:min(540px,100%);background:#fff;border-radius:6px;padding:28px 30px;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .28s cubic-bezier(.2,.8,.2,1)}

.dlg p{line-height:1.6;margin-bottom:24px;color:#444}
.dlg a,.dlg button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-block;padding:10px 26px;border-radius:30px;background:#fff;color:var(--tx);font-size:16px;margin-right:8px;box-shadow:inset 0 0 0 2px #cfcfcf}
.dlg a[hidden]{display:none}
.dlg a:hover,.dlg button:hover,.dlg a:focus-visible,.dlg button:focus-visible{box-shadow:inset 0 0 0 3px var(--cy)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

const $=id=>document.getElementById(id),trk=$("trk"),dock=$("dock"),ov=$("ov"),mn=$("mn");

let sel=0,bs=0,zone="t",sOn=true,ac;
function tone(f,d,ty,v,dl){const t=ac.currentTime+(dl||0),o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02)}
function snd(k){if(!sOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();

else if(k==="ok"){tone(700,.09,"sine",.12);tone(1050,.14,"sine",.1,.07)}

if(kp===KON.length){kp=0;document.body.classList.toggle("rb")}

else if(k==="ArrowDown"){if(zone!=="b")snd("tick");zone="b";render()}else if(k==="ArrowUp"){if(zone!=="t")snd("tick");zone="t";render()}else if(k==="m")tgl()
