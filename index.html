<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>mwkdev.pp.ua</title>
<style>
:root{--g1:#14a514;--g2:#0e8f0e;--gap:3px;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Segoe UI","Segoe UI Light","Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden;background:linear-gradient(165deg,#3e3e3f 0%,#7b7b7c 32%,#bcbcbc 62%,#dedede 100%);display:flex;flex-direction:column}
.top{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:14px 34px;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.top a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:12px}
.top a:hover span{text-decoration:underline}
.av{width:44px;height:44px;border-radius:3px;background:linear-gradient(135deg,#1aa31a,#0b6b0b);display:grid;place-items:center;font-size:22px;font-weight:600;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
nav{display:flex;gap:clamp(18px,3.6vw,56px);padding:clamp(6px,3vh,40px) 0 clamp(12px,3vh,30px) clamp(24px,8vw,130px);overflow-x:auto;scrollbar-width:none}
nav button{all:unset;cursor:pointer;font-size:clamp(26px,4.4vw,58px);font-weight:300;color:rgba(255,255,255,.62);text-shadow:0 2px 4px rgba(0,0,0,.35);white-space:nowrap;transition:color .3s,transform .3s}
nav button:hover{color:rgba(255,255,255,.92)}
nav button[aria-selected=true]{color:#fff;font-weight:400;transform:translateY(-2px)}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.stage{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:0 0 34px clamp(24px,13vw,200px);display:flex;gap:var(--gap);max-height:min(100%,640px)}
.stage::-webkit-scrollbar{display:none}
.col{display:flex;flex-direction:column;gap:var(--gap);flex:0 0 clamp(160px,18vw,260px)}
.col.f{flex:0 0 clamp(300px,52vw,720px)}
.col.r{padding-right:clamp(24px,13vw,200px)}
.tile{all:unset;box-sizing:border-box;flex:1;position:relative;cursor:pointer;background:linear-gradient(var(--g1),var(--g2));display:flex;flex-direction:column;justify-content:flex-end;padding:0 12px 12px 18px;font-size:clamp(15px,1.5vw,22px);text-shadow:0 1px 2px rgba(0,0,0,.35);overflow:hidden;min-height:76px;color:#fff;transition:transform .2s,box-shadow .2s,filter .2s}
.tile .sub{font-size:11px;letter-spacing:1px;opacity:.75;margin-top:2px;text-transform:uppercase}
.tile svg.i{position:absolute;left:50%;top:38%;width:clamp(34px,4.4vw,62px);transform:translate(-50%,-50%);fill:none;stroke:#e9f7e9;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
a.tile::after{content:"↗";position:absolute;top:8px;right:12px;font-size:16px;opacity:.7}
.tile:hover,.tile:focus-visible{z-index:2;box-shadow:0 0 0 4px #fff,0 6px 22px rgba(0,0,0,.45);transform:scale(1.025);filter:brightness(1.12)}
.tile:active{transform:scale(.98)}
.tile.feat{padding:0;background:var(--fg)}
.tile.feat svg.i{top:34%;width:clamp(56px,8vw,110px);stroke:rgba(255,255,255,.92)}
.tile.feat .desc{margin:auto 18px 14px;max-width:46ch;font-size:clamp(13px,1.2vw,17px);line-height:1.45;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tile.feat .cap{padding:10px 18px;background:rgba(10,20,34,.8);font-size:clamp(16px,1.7vw,24px)}
.tile.feat::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-130%);animation:shine 6s ease-in-out infinite}
@keyframes shine{55%,100%{transform:translateX(130%)}}
.in .tile{animation:tin .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes tin{from{opacity:0;transform:translateX(70px)}}
.in.back .tile{animation-name:tinb}
@keyframes tinb{from{opacity:0;transform:translateX(-70px)}}
.ov{position:fixed;inset:0;z-index:20;background:rgba(20,22,22,.6);backdrop-filter:blur(4px);display:none;place-items:center;padding:20px}
.ov.on{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{width:min(560px,100%);background:linear-gradient(#f3f3f3,#d4d4d4);color:#222;border-top:6px solid var(--g1);padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.dlg h2{font-weight:300;font-size:32px;margin-bottom:6px}
.dlg .bd{font-size:12px;letter-spacing:1.5px;color:#0e7a0e;font-weight:700;margin-bottom:12px}
.dlg p{line-height:1.55;margin-bottom:22px}
.dlg button,.dlg a{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 24px;background:#0e8f0e;color:#fff;margin-right:8px;font-size:16px}
.dlg button.x{background:#8a8a8a}
.dlg button:hover,.dlg a:hover{filter:brightness(1.15)}
.dlg :focus-visible{outline-color:#222}
@media (max-width:640px){.top{padding:10px 16px}.stage{padding-left:16px}.col{flex-basis:150px}.col.f{flex-basis:80vw}.col.r{padding-right:16px}nav{padding-left:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

const L={gh:["GitHub","code","https://github.com/masik52xd","Репозиторії @masik52xd","SOURCE CODE"],yt:["YouTube","yt","https://www.youtube.com/@Mas1k52","Офіційний канал @Mas1k52","ВІДЕО"],dc:["Discord","chat","https://discord.gg/DNbV8uCynp","Спільнота true. Приєднуйтесь до обговорення проектів.","TRUE. COMMUNITY"],ml:["Email","mail","mailto:buzznachile@gmail.com","buzznachile@gmail.com","НАПИСАТИ ЛИСТ"],rc:["Random Countries","box","https://masik52xd.github.io/RandomCountry/","Архівний експериментальний проект генерації країн.","АРХІВ"]};
const T=[
{n:"про мене",f:"linear-gradient(135deg,#0d5aa8,#2aa6d6 55%,#0b3f78)",c:[
 [["Вайбкодінг","spark",0,"Гнучке створення коду за допомогою ШІ для розв’язання реальних завдань. Пишу код через різні ШІ, але роблю все те, що могло б мені і іншим людям реально знадобитися в житті.","ШІ ПІДХІД"],
  ["Без навантаження","gauge",0,"Усі проекти створюються з фокусом на те, щоб споживати мінімум ресурсів заліза.","ШВИДКІСТЬ"],
  ["Open‑Source","lock",0,"Жодної прихованої телеметрії, реклами чи збору персональних даних у коді. Всі мої репозиторії під ліцензією MIT, навіть якщо там це не написано.","MIT LICENSE"]],
 ["Ласкаво просимо на mwkdev.pp.ua!","code",0,"Це сайт Masik’а — вайбкодера, моддера та контент-креатора. Тут ви можете знайти мої програми, авторські утиліти та інші експериментальні розробки.","ОФІЦІЙНИЙ САЙТ // 2026"],
 [L.gh,L.yt,L.dc]]},
{n:"софт",f:"linear-gradient(135deg,#a82a00,#f0742a 55%,#7a1c00)",c:[
 [["EzTyper","file","https://github.com/masik52xd/EzTyper/tree/main","Текстовий редактор сценаріїв, у якому фішок значно більше, ніж у notepad.exe, але ресурсів він споживає менше.","ВІДКРИТИ GITHUB"],
  ["Оптимізація","gauge",0,"Створюю програми, які не перевантажують залізо. Мінімум процесів та фонової активності для стабільної роботи навіть на застарілих девайсах. Окрім IF ELSE :)","PERFORMANCE"]],
 ["SOMAF1X","game","https://masik52xd.github.io/s0maf1x-launcher-site/","Найлегший Minecraft Launcher з унікальним дизайном та нативною підтримкою Ely.by спільноти.","ПЕРЕЙТИ НА САЙТ"],

 [["Broadcast Suite","tv","https://masik52xd.github.io/Broadcast-suite/","Професійна оверлей-платформа для трансляцій кіберспортивних матчів незалежними організаторами.","ESPORTS OVERLAY"],
  ["MakeIt Hub","rocket","https://masik52xd.github.io/makeithavoc/","Платформа для навчання нових гравців та входу у світ Havoc з інтегрованою чергою матчів.","COMMUNITY HUB"],
  ["Havoc.gg","chart","https://masik52xd.github.io/Havoc.gg/","Глобальний портал для збору статистики, матчів та публікації новин гри Havoc (в розробці).","В РОЗРОБЦІ"]],
 ["Chess Upgrader","chess","https://masik52xd.github.io/Chess","Шахи з новою фішкою — апгрейд фігур! Працює через P2P, має MIT ліцензію.","P2P GAME"],
 [["Upgrader","up","http://mwkdev.pp.ua/upgrader/","Апгрейди віртуальні скіни з віртуальним балансом! Додає азарту.","SIMULATOR"],L.rc]]},
{n:"контакти",f:"linear-gradient(135deg,#5b2a86,#8b5fd0 55%,#2d1450)",c:[

 [L.rc,["Про сайт","info",0,"Сайт у стилі головного меню Xbox 360. Кожна плитка клікабельна: посилання відкриваються в новій вкладці, інші плитки показують опис.","© 2026 MASIK"]]]}
];
const tabs=document.getElementById("tabs"),stage=document.getElementById("stage"),ov=document.getElementById("ov");
let cur=0,prev=0,data=[];
const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic=k=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
function tile(x,feat){const id=data.push(x)-1,link=x[2];
const inner=feat?`${ic(x[1])}<span class="desc">${e(x[3])}</span><span class="cap">${e(x[0])}</span>`:`${ic(x[1])}<span>${e(x[0])}</span><span class="sub">${e(x[4])}</span>`;
const cls="tile"+(feat?" feat":"");
return link?`<a class="${cls}" href="${e(link)}" ${link.startsWith("http")?'target="_blank" rel="noopener"':""} title="${e(x[3])}">${inner}</a>`:`<button class="${cls}" data-i="${id}" title="${e(x[3])}">${inner}</button>`}
function draw(){
tabs.innerHTML=T.map((x,k)=>`<button role="tab" aria-selected="${k===cur}" data-k="${k}">${e(x.n)}</button>`).join("");
const c=T[cur].c;data=[];
stage.className="stage in"+(cur<prev?" back":"");stage.style.setProperty("--fg",T[cur].f);
stage.innerHTML=`<div class="col">${c[0].map(x=>tile(x)).join("")}</div><div class="col f">${tile(c[1],1)}</div><div class="col r">${c[2].map(x=>tile(x)).join("")}</div>`;
stage.scrollLeft=0;
[...stage.querySelectorAll(".tile")].forEach((t,i)=>t.style.animationDelay=i*45+"ms");
}
function open(x){document.getElementById("dt").textContent=x[0];document.getElementById("db").textContent=x[4];document.getElementById("dp").textContent=x[3];ov.classList.add("on");document.getElementById("dx").focus()}
function close(){ov.classList.remove("on")}
stage.addEventListener("click",ev=>{const b=ev.target.closest("button.tile");if(b)open(data[+b.dataset.i])});
stage.addEventListener("wheel",ev=>{if(Math.abs(ev.deltaY)>Math.abs(ev.deltaX)){stage.scrollLeft+=ev.deltaY}},{passive:true});
tabs.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;prev=cur;cur=+b.dataset.k;draw()});
document.getElementById("dx").onclick=close;
ov.addEventListener("click",ev=>{if(ev.target===ov)close()});
document.addEventListener("keydown",ev=>{
if(ev.key==="Escape"){close();return}
if(ov.classList.contains("on"))return;
if(ev.key!=="ArrowRight"&&ev.key!=="ArrowLeft")return;
prev=cur;cur=(cur+(ev.key==="ArrowRight"?1:T.length-1))%T.length;draw()});
draw();
</script>
